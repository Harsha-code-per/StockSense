# Local PostgreSQL for development. Usage: docker compose up -d db
# Port busy on your machine? DB_PORT=5433 docker compose up -d db  (and match DATABASE_URL)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense
      POSTGRES_DB: stocksense
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
