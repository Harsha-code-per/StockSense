# Backend CI (owner: Member 1). The frontend has its own workflow (Member 2), so the two never conflict.
name: backend

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stocksense
          POSTGRES_PASSWORD: stocksense
          POSTGRES_DB: stocksense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stocksense"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://stocksense:stocksense@localhost:5432/stocksense
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations apply, roll back and re-apply cleanly
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - name: Tests (real Postgres)
        run: pytest -q
