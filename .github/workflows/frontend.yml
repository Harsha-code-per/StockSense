name: Frontend
on:
  push:
    branches: [main, 'feat/**']
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  # Every PR runs this check: it's required by branch protection, and a path filter
  # would leave docs/backend-only PRs waiting forever for a check that never starts.
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results/
